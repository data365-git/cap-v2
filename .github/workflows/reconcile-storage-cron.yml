name: Reconcile storage

# Hits the app's storage-reconcile endpoint on a schedule so orphaned DB rows
# (video whose S3/R2 object has gone missing) get flagged, and uploads stuck in
# a non-terminal phase for >24h get settled to "error".
# Requires the repo secret CRON_SECRET (same value as the app's CRON_SECRET env).
# Until that secret is added, each run safely skips (no failures).

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (offset so it doesn't collide with other crons)
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Ping reconcile-storage
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://web-production-e6fe4.up.railway.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret not set yet — skipping."
            echo "Add it in: repo Settings -> Secrets and variables -> Actions -> New repository secret (name CRON_SECRET)."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/reconcile-storage")
          echo "HTTP $code"
          cat /tmp/out.txt || true
          if [ "$code" != "200" ]; then
            echo "Reconcile ping failed"
            exit 1
          fi
